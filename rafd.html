*{box-sizing:border-box}body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--cr);color:var(--tx)}
a{color:inherit}h1,h2,h3{color:var(--fg);margin:.2em 0}
header{background:var(--fg);color:#fff;position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:12px;padding:0 14px}
.logo{font-weight:700;font-size:20px;line-height:1.1;text-align:center;padding:6px 8px;cursor:pointer}.logo small{display:block;font-size:14px}
nav{display:flex;flex:1;overflow-x:auto;gap:2px}nav a{color:#fff;text-decoration:none;padding:16px 9px;font-size:13px;white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer}
nav a.on{border-color:var(--lf);background:#ffffff14}
.lang{background:none;border:1px solid #fff8;color:#fff;border-radius:20px;padding:5px 11px;cursor:pointer}
#burger{display:none;background:none;border:0;color:#fff;font-size:26px}
@media(max-width:1100px){#burger{display:block}nav{display:none;position:absolute;top:100%;inset-inline:0;background:var(--fg);flex-direction:column;max-height:75vh}nav.open{display:flex}nav a{padding:12px 18px}}
main{min-height:80vh}.wrap{max-width:1200px;margin:auto;padding:18px}
.hero{background:linear-gradient(90deg,#0d2a17cc,#0d2a1766),var(--hero) center/cover;color:#fff;padding:28px 14px 20px}
.hero .in{max-width:1200px;margin:auto;display:flex;gap:24px;flex-wrap:wrap;align-items:stretch}
.hero h1{color:#fff;font-size:clamp(26px,4vw,44px);line-height:1.2}.hero p{max-width:560px;line-height:1.7}
.panel{background:#fffffff2;color:var(--tx);border-radius:16px;padding:14px;box-shadow:0 4px 16px #0002}
.mapbox{flex:1 1 360px;max-width:480px}.txt{flex:1 1 380px;display:flex;flex-direction:column;justify-content:center}
.map{height:260px;border-radius:12px;margin:8px 0;z-index:0}.map.big{height:520px}.full{position:fixed!important;inset:0;height:100%!important;z-index:2000;border-radius:0}
.btn{background:var(--fg);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;margin:3px}.btn.lf{background:var(--lf)}.btn.out{background:#fff;color:var(--fg);border:1px solid var(--fg)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:hover{filter:brightness(1.1)}
input,select,textarea{font:inherit;padding:8px;border:1px solid #bcc7b3;border-radius:8px;background:#fff;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>.btn{flex:0 0 auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px #0001;border:1px solid #0000000d}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{transform:translateY(-3px);box-shadow:0 6px 16px #0002}
.feat{background:#143a2299;border:1px solid #ffffff44;color:#fff;border-radius:14px;padding:14px;cursor:pointer;backdrop-filter:blur(4px)}.feat h3{color:#fff;font-size:16px}.feat p{font-size:13px;margin:4px 0}
.cream{background:var(--sd);border-radius:18px;padding:18px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.ic{font-size:26px}.sage{background:var(--sg)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}.low{background:var(--lf)}.med{background:#e69a1a}.high{background:#c9392c}.na{background:#8a948c}
.vx{background:#fff;border:3px solid var(--lf);border-radius:50%}
.ch{width:100%;max-width:380px}.ch text{font-size:9px;fill:#555}
.cap{font-size:12px;color:#5b655e;margin-top:4px}.note{background:#fff7e0;border-inline-start:4px solid #e69a1a;padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #ddd;padding:7px;text-align:start;vertical-align:top}th{background:var(--sg)}.tw{overflow-x:auto}
.steps{display:flex;gap:6px;margin-bottom:10px}.steps span{flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--sg)}.steps .on{background:var(--fg);color:#fff}
.flow{display:flex;gap:8px;flex-wrap:wrap}.flow div{flex:1 1 120px;background:var(--sg);border-radius:12px;padding:12px;text-align:center;transition:.3s;opacity:.55}.flow div.on{opacity:1;background:var(--lf);color:#fff}
#modal{display:none;position:fixed;inset:0;background:#0007;z-index:3000;align-items:center;justify-content:center;padding:14px}#modal.show{display:flex}#modal .card{max-width:560px;max-height:85vh;overflow:auto}
footer{text-align:center;padding:18px;font-size:12px;color:#666}
@media print{header,footer,.btn,.noprint{display:none!important}body{background:#fff}}

const area=p=>{if(p.length<3)return 0;const R=6378137,r=Math.PI/180;let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=(b[1]-a[1])*r*(2+Math.sin(a[0]*r)+Math.sin(b[0]*r))}return Math.abs(s*R*R/2)};

const cache={};
async function clim(c){const k=c.map(x=>x.toFixed(2)).join();if(cache[k])return cache[k];const r=await fetch(`https://power.larc.nasa.gov/api/temporal/climatology/point?parameters=T2M,PRECTOTCORR,ALLSKY_SFC_SW_DWN&community=AG&longitude=${c[1]}&latitude=${c[0]}&format=JSON`);if(!r.ok)throw 0;return cache[k]=(await r.json()).properties.parameter}
async function wx(c){const d=new Date(),s=new Date(d-12*864e5),f=x=>x.toISOString().slice(0,10).replace(/-/g,'');const r=await fetch(`https://power.larc.nasa.gov/api/temporal/daily/point?parameters=T2M,PRECTOTCORR,RH2M,WS2M&community=AG&longitude=${c[1]}&latitude=${c[0]}&start=${f(s)}&end=${f(d)}&format=JSON`);const p=(await r.json()).properties.parameter;const ds=Object.keys(p.T2M).filter(k=>p.T2M[k]>-900).sort();const k=ds.pop();if(!k)throw 0;return{k,T:p.T2M[k],P:p.PRECTOTCORR[k],H:p.RH2M[k],W:p.WS2M[k]*3.6}}
const UNV=()=>`<div class="note">⚠️ ${tr('Data unavailable: NASA POWER could not be reached. No values are invented. (Check your internet connection.)','البيانات غير متاحة: تعذر الوصول إلى NASA POWER. لا يتم اختلاق أي قيم. (تحقق من الاتصال.)')}</div>`;
function chart(o,title,unit,type,col){if(!o)return'';const v=MO.map(m=>o[m]);const W=330,H=140,mx=Math.max(...v),mn=type=='bar'?0:Math.min(...v),sx=i=>26+i*(W-36)/11,sy=x=>H-20-(x-mn)/((mx-mn)||1)*(H-40);
let s=`<svg viewBox="0 0 ${W} ${H}" class="ch"><text x="2" y="10">${f1(mx,2)}</text><text x="2" y="${H-22}">${f1(mn,2)}</text>`;
if(type=='bar')s+=v.map((x,i)=>`<rect x="${sx(i)-8}" y="${sy(x)}" width="16" height="${H-20-sy(x)}" fill="${col}" rx="2"><title>${MO[i]}: ${f1(x,2)} ${unit}</title></rect>`).join('');
else s+=`<polyline fill="none" stroke="${col}" stroke-width="2.5" points="${v.map((x,i)=>sx(i)+','+sy(x)).join(' ')}"/>`+v.map((x,i)=>`<circle cx="${sx(i)}" cy="${sy(x)}" r="3" fill="${col}"><title>${MO[i]}: ${f1(x,2)} ${unit}</title></circle>`).join('');
s+=[...'JFMAMJJASOND'].map((m,i)=>`<text x="${sx(i)-3}" y="${H-6}">${m}</text>`).join('')+'</svg>';
return`<div class="card"><b>${title}</b> <span class="cap">(${unit})</span>${s}<div class="cap">${tr('Source: NASA POWER climatology (multi-year monthly means) · unit','المصدر: مناخ NASA POWER (متوسطات شهرية متعددة السنوات) · الوحدة')}: ${unit} · ${tr('Selected point only; ~0.5° grid, not farm-boundary measurement','النقطة المحددة فقط؛ شبكة ≈0.5° وليست قياساً لحدود المزرعة')}</div></div>`}
const charts=(cl,loc)=>`<div class="grid">${chart(cl.T2M,tr('Air temperature','درجة حرارة الهواء'),'°C','line','#c9392c')}${chart(cl.PRECTOTCORR,tr('Precipitation','الهطول'),'mm/day','bar','#2e7fb8')}${chart(cl.ALLSKY_SFC_SW_DWN,tr('Solar radiation','الإشعاع الشمسي'),'kWh/m²/day','line','#e69a1a')}</div>`;
function stats(cl){const T=cl.T2M,P=cl.PRECTOTCORR;return{Ta:T.ANN,Ts:(T.JUN+T.JUL+T.AUG)/3,Pa:P.ANN*365,R:cl.ALLSKY_SFC_SW_DWN.ANN}}
const withClim=(id,fn)=>{const l=curLoc();clim(l.c).then(cl=>{const e=$('#'+id);if(e)e.innerHTML=fn(cl,l)}).catch(()=>{const e=$('#'+id);if(e)e.innerHTML=UNV()})};
const loading=id=>`<div id="${id}"><div class="cap">⏳ ${tr('Loading NASA POWER data…','جاري تحميل بيانات NASA POWER…')}</div></div>`;

/* ---------- maps ---------- */
function mkMap(id,o={}){
const m=L.map(id,{scrollWheelZoom:!o.mini,doubleClickZoom:false}).setView(farm.c||[24.7,44.5],farm.c?14:5);maps.push(m);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri, Maxar, Earthstar Geographics',maxZoom:19}).addTo(m);
const std=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19});
L.control.layers({[tr('Satellite','قمر صناعي')]:sat,[tr('Standard','خريطة')]:std}).addTo(m);
const g=L.layerGroup().addTo(m),T={m,g,draw:false,ro:o.ro};
T.redraw=()=>{g.clearLayers();const p=farm.pts;if(p.length>=3)L.polygon(p,{color:'#5aa646',weight:2,fillOpacity:.25}).addTo(g);else if(p.length==2)L.polyline(p,{color:'#5aa646'}).addTo(g);
if(!T.ro)p.forEach((q,i)=>{const mk=L.marker(q,{draggable:true,icon:L.divIcon({className:'vx',iconSize:[14,14]})}).addTo(g);mk.on('drag',e=>{farm.pts[i]=[e.latlng.lat,e.latlng.lng]});mk.on('dragend',()=>{T.redraw();upd()});mk.on('contextmenu dblclick',()=>{farm.pts.splice(i,1);T.redraw();upd()})});
if(farm.c&&p.length<3)L.marker(farm.c).addTo(g)};
if(!o.ro)m.on('click',e=>{if(T.draw)farm.pts.push([e.latlng.lat,e.latlng.lng]);else farm.c=[e.latlng.lat,e.latlng.lng];T.redraw();upd()});
m.on('mousemove',e=>{const c=$('#cur');if(c)c.textContent=e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5)});
if(farm.pts.length>=3)m.fitBounds(L.polygon(farm.pts).getBounds(),{maxZoom:17});
T.redraw();S=T;setTimeout(()=>m.invalidateSize(),200);return T}
function upd(){const p=farm.pts;if(p.length>=3){farm.c=[p.reduce((a,x)=>a+x[0],0)/p.length,p.reduce((a,x)=>a+x[1],0)/p.length]}save();
const a=farmArea(),e=$('#areaTxt'),c=$('#coordTxt'),i=$('#info');if(e)e.textContent=a?`${tr('Approx. Area','المساحة التقريبية')}: ${(a/1e4).toFixed(2)} ha`:tr('Draw a boundary to calculate area','ارسم الحدود لحساب المساحة');if(c)c.textContent=farm.c?farm.c.map(x=>x.toFixed(5)).join(', '):'—';if(i)i.innerHTML=infoHTML()}

<div class="card"><h3>${tr('Official Saudi Government Sources','المصادر الحكومية السعودية الرسمية')}</h3><div class="grid">${SRC.slice(0,4).map((s,i)=>`<div class="card click sage" onclick="src(${i})"><span class="ic">${s.ic}</span><div class="cap">${tt(s.o)}</div></div>`).join('')}</div></div>

function src(i){const s=SRC[i];$('#modal').innerHTML=`<div class="card"><h3>${s.ic} ${tt(s.o)}</h3><table>${[['Dataset / info type','نوع المعلومات',s.t],['Geographic coverage','التغطية',s.cov],['Time period','الفترة',s.per],['How RAFD uses it','كيف يستخدمه رفد',s.use],['Limitations','القيود',s.lim]].map(r=>`<tr><th>${tr(r[0],r[1])}</th><td>${tt(r[2])}</td></tr>`).join('')}<tr><th>${tr('Link','الرابط')}</th><td><a href="${s.u}" target="_blank" rel="noopener">${s.u}</a></td></tr></table><button class="btn" onclick="$('#modal').classList.remove('show')">${tr('Close','إغلاق')}</button></div>`;$('#modal').classList.add('show')}
P.regions=()=>`<div class="wrap"><h2>${tr('Saudi Agricultural Regions','المناطق الزراعية في المملكة')}</h2><div class="note">${tr('A selected point represents a specific location, not necessarily the entire region.','النقطة المحددة تمثل موقعاً بعينه وليس المنطقة كلها بالضرورة.')}</div><div class="grid">${Object.entries(REG).map(([k,r])=>`<div class="card click" onclick="go('region','${k}')"><h3>${tt(r.n)}</h3><p>${tt(r.d)}</p><div class="cap">${tr('Crops','المحاصيل')}: ${tt(r.cr)}</div></div>`).join('')}</div></div>`;
P.region=()=>{const k=REG[arg]?arg:'qassim',r=REG[k];after=()=>{const m=L.map('rg',{scrollWheelZoom:false}).setView(r.c,8);maps.push(m);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri'}).addTo(m);L.marker(r.c).addTo(m).bindTooltip(tt(r.city));setTimeout(()=>m.invalidateSize(),200);clim(r.c).then(cl=>{$('#rc').innerHTML=charts(cl)}).catch(()=>{$('#rc').innerHTML=UNV()})};
return`<div class="wrap"><button class="btn sm out" onclick="go('regions')">← ${tr('Regions','المناطق')}</button><h2>${tt(r.n)}</h2><div class="grid"><div><div id="rg" class="map big" style="height:300px"></div><div class="cap">📍 ${tt(r.city)} · ${r.c.join(', ')} (${tr('reference point','نقطة مرجعية')})</div></div><div class="card"><table>${[['Climate overview','نظرة مناخية',r.d],['Known regional crops','المحاصيل المعروفة',r.cr],['Main challenges','أهم التحديات',r.ch],['Suggested solutions','الحلول المقترحة',r.sol]].map(x=>`<tr><th>${tr(x[0],x[1])}</th><td>${tt(x[2])}</td></tr>`).join('')}<tr><th>${tr('Data availability','توفر البيانات')}</th><td>NASA POWER: ✔ ${tr('live','مباشر')}<br>GPM / SMAP: ✖ ${tr('not connected','غير مربوط')}<br>${tr('Saudi official data: links only','بيانات سعودية: روابط فقط')}</td></tr></table></div></div><div id="rc">${loading('x')}</div></div>`};
P.pub=()=>{after=()=>{Promise.all(Object.entries(REG).map(([k,r])=>clim(r.c).then(cl=>[k,cl]))).then(a=>{const sx=Object.fromEntries(a.map(([k,cl])=>[k,stats(cl)]));$('#pd').innerHTML=`<div class="grid">${a.map(([k])=>`<div class="card click" onclick="go('region','${k}')"><h3>${tt(REG[k].n)}</h3><div>🌡️ ${f1(sx[k].Ta)} °C</div><div>🌧️ ${f1(sx[k].Pa,0)} mm/${tr('yr','سنة')}</div><div>☀️ ${f1(sx[k].R,2)} kWh/m²/d</div><div class="cap">${tt(REG[k].city)} · NASA POWER</div></div>`).join('')}</div><h3>${tr('Regional comparison — mean annual temperature (°C)','مقارنة المناطق — متوسط الحرارة السنوية (°C)')}</h3><div class="card">${a.map(([k])=>`<div class="row"><span style="flex:0 0 90px">${tt(REG[k].n)}</span><div style="flex:1;background:var(--sg);border-radius:6px"><div style="width:${Math.min(100,sx[k].Ta*2.5)}%;background:var(--fg);color:#fff;border-radius:6px;padding:2px 6px;font-size:12px">${f1(sx[k].Ta)}</div></div></div>`).join('')}<div class="cap">${tr('NASA POWER climatology, same method for all four reference points.','مناخ NASA POWER بنفس الطريقة للنقاط المرجعية الأربع.')}</div></div><h3>${tr('Monthly trends','الاتجاهات الشهرية')}</h3><select onchange="sel=this.value;pdet()">${Object.entries(REG).map(([k,r])=>`<option value="${k}">${tt(r.n)}</option>`).join('')}</select><div id="pdet"></div>`;sel=sel&&REG[sel]?sel:'jouf';pdet()}).catch(()=>{$('#pd').innerHTML=UNV()})};
return`<div class="wrap"><h2>${tr('Public Dashboard','اللوحة العامة')}</h2>${loading('pd')}</div>`};
function pdet(){const k=REG[sel]?sel:'jouf';clim(REG[k].c).then(cl=>{$('#pdet').innerHTML=charts(cl)+`<div class="note">${tr('Main risks: ','أهم المخاطر: ')}${tt(REG[k].ch)}<br>${tr('Solutions: ','الحلول: ')}${tt(REG[k].sol)}</div>`})}
P.farmer=()=>{if(!farm.c)return`<div class="wrap card"><h2>${tr('Farmer Dashboard','لوحة المزارع')}</h2><p>${tr('No farm selected yet.','لم تحدد مزرعة بعد.')}</p><button class="btn" onclick="go('setup')">${tr('Go to Farm Setup','اذهب لإعداد المزرعة')}</button></div>`;sel='farm';const I=farm.info,n=nearest(farm.c);after=()=>{mkMap('fm',{mini:1,ro:1});withClim('fi',(cl)=>{const s=stats(cl),pr=problems(cl).filter(p=>p.r=='high'||p.r=='med').length;return`<div class="grid">${[[tr('Temperature','الحرارة'),f1(s.Ta)+' °C'],[tr('Rainfall','الأمطار'),f1(s.Pa,0)+' mm/'+tr('yr','سنة')],[tr('Water availability','توفر المياه'),I.qty||tr('Not provided','غير مدخل')],[tr('Soil type','نوع التربة'),I.soil||'—'],[tr('Crop status','حالة المحصول'),I.crop?I.crop+(I.stage?' · '+I.stage:''):'—'],[tr('Agricultural risks','المخاطر'),pr+' '+tr('flagged','منبّهة')]].map(x=>`<div class="card"><div class="cap">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div><div class="cap">${tr('Temperature/rainfall: NASA POWER climatology at the farm grid cell.','الحرارة/الأمطار: مناخ NASA POWER للخلية المحيطة بالمزرعة.')}</div>`})};
return`<div class="wrap"><h2>RAFD · ${tr('Farmer Dashboard','لوحة المزارع')}</h2><div class="row noprint"><button class="btn sm" onclick="step=2;go('setup')">${tr('Edit Farm Data','تعديل البيانات')}</button><button class="btn sm" onclick="go('map')">${tr('Edit Farm Location','تعديل الموقع')}</button><button class="btn sm lf" onclick="go('problems')">${tr('Start New Analysis','بدء تحليل جديد')}</button></div><p>📍 ${tt(REG[n[0]].n)} · ${farm.c.map(x=>x.toFixed(4)).join(', ')}</p>${loading('fi')}<div class="grid" style="margin-top:12px"><div id="fm" class="map"></div><div class="card"><table><tr><th>${tr('Area','المساحة')}</th><td>${(farmArea()/1e4).toFixed(2)} ha</td></tr><tr><th>${tr('Water source','مصدر المياه')}</th><td>${I.water||'—'}</td></tr><tr><th>${tr('Previous crops','المحاصيل السابقة')}</th><td>${I.prev||'—'}</td></tr><tr><th>${tr('Irrigation','الري')}</th><td>${I.irr||'—'}</td></tr><tr><th>${tr('Missing information','معلومات ناقصة')}</th><td>${missing().join('، ')||'—'}</td></tr></table></div></div></div>`};
P.map=()=>{after=()=>{mkMap('mm');upd()};return`<div class="wrap"><h2>${tr('Satellite Farm Location Selection','تحديد موقع المزرعة بالقمر الصناعي')}</h2><div class="grid" style="grid-template-columns:2fr 1fr"><div>${mapTools()}<div id="mm" class="map big"></div><div class="cap">🖱️ <span id="cur">—</span> · ${tr('Tap to select a point; use Draw to add boundary points; drag points to edit; double-click/right-click a point to delete.','اضغط لتحديد نقطة؛ استخدم الرسم لإضافة نقاط؛ اسحب النقاط للتعديل؛ انقر مرتين/يمين على نقطة لحذفها.')}</div></div><div class="card"><div class="row"><button class="btn sm" onclick="toggleDraw(this)">✏️ ${tr('Draw boundary','ارسم الحدود')}</button><button class="btn sm out" onclick="undo()">↶ ${tr('Undo','تراجع')}</button><button class="btn sm out" onclick="clearAll()">🗑️ ${tr('Clear','مسح')}</button></div><div id="info"></div><button class="btn lf" style="width:100%" onclick="confirmFarm()">${tr('Confirm Farm Location','تأكيد موقع المزرعة')}</button></div></div></div>`};
const sel_=(k,v)=>`<select onchange="farm.info.${k}=this.value;save()"><option value="">${tr('— skip —','— تخطي —')}</option>${OPT[k].map(o=>`<option value="${o[0]}" ${v==o[0]?'selected':''}>${tr(o[1],o[2])}</option>`).join('')}</select>`;
const inp=(k,l,t='text')=>`<label>${l}<input type="${t}" value="${farm.info[k]||''}" oninput="farm.info.${k}=this.value;save()"></label>`;
P.setup=()=>{const I=farm.info;after=()=>upd();const st=[tr('Location','الموقع'),tr('Farm information','معلومات المزرعة'),tr('Review','المراجعة')];
let b='';if(step==1)b=`<div class="grid"><label>${tr('Region','المنطقة')}<select onchange="farm.info.region=this.value;save()"><option value="">—</option>${Object.entries(REG).map(([k,r])=>`<option value="${k}" ${I.region==k?'selected':''}>${tt(r.n)}</option>`).join('')}</select></label>${inp('city',tr('City / location','المدينة / الموقع'))}</div><div id="info">${infoHTML()}</div><button class="btn" onclick="go('map')">🛰️ ${tr('Open satellite map','افتح خريطة القمر الصناعي')}</button>`;
else if(step==2)b=`<div class="grid">${inp('area',tr('Farm area (ha) — overrides calculated','مساحة المزرعة (هكتار) — تتجاوز المحسوبة'),'number')}<label>${tr('Soil type','نوع التربة')}${sel_('soil',I.soil)}</label><label>${tr('Soil moisture level','مستوى رطوبة التربة')}${sel_('moisture',I.moisture)}</label><label>${tr('Water source','مصدر المياه')}${sel_('water',I.water)}</label>${inp('qty',tr('Available water quantity (if known)','كمية المياه المتاحة (إن عُرفت)'))}${inp('crop',tr('Current crop','المحصول الحالي'))}${inp('prev',tr('Previous crops','المحاصيل السابقة'))}<label>${tr('Irrigation method','طريقة الري')}${sel_('irr',I.irr)}</label>${inp('stage',tr('Crop growth stage','مرحلة نمو المحصول'))}</div><div class="cap">${tr('You may skip unknown fields.','يمكنك تخطي الحقول غير المعروفة.')}</div>`;
else b=`<table>${[['region',tr('Region','المنطقة')],['city',tr('City','المدينة')],['area',tr('Area (ha)','المساحة (هكتار)')],['soil',tr('Soil','التربة')],['moisture',tr('Soil moisture','رطوبة التربة')],['water',tr('Water source','مصدر المياه')],['qty',tr('Water quantity','كمية المياه')],['crop',tr('Current crop','المحصول الحالي')],['prev',tr('Previous crops','السابقة')],['irr',tr('Irrigation','الري')],['stage',tr('Growth stage','مرحلة النمو')]].map(x=>`<tr><th>${x[1]}</th><td>${I[x[0]]||'<span class="cap">'+tr('skipped','تم التخطي')+'</span>'}</td></tr>`).join('')}<tr><th>${tr('Location','الموقع')}</th><td>${farm.c?farm.c.map(x=>x.toFixed(5)).join(', '):'—'}</td></tr></table><div class="row noprint"><button class="btn sm out" onclick="step=1;render()">${tr('Edit location','عدّل الموقع')}</button><button class="btn sm out" onclick="step=2;render()">${tr('Edit info','عدّل المعلومات')}</button><button class="btn sm out" onclick="if(confirm('${tr('Reset all farm data?','مسح كل بيانات المزرعة؟')}')){farm={pts:[],info:{}};save();step=1;render()}">${tr('Reset','إعادة ضبط')}</button></div><button class="btn lf" onclick="farm.ok=1;save();sel='farm';go('problems')">${tr('Analyze My Farm','حلل مزرعتي')}</button>`;
return`<div class="wrap"><h2>${tr('Farm Setup','إعداد المزرعة')}</h2><div class="steps">${st.map((s,i)=>`<span class="${step==i+1?'on':''}">${i+1}. ${s}</span>`).join('')}</div><div class="card">${b}<div class="row noprint" style="margin-top:10px">${step>1?`<button class="btn out" onclick="step--;render()">←</button>`:''}${step<3?`<button class="btn" onclick="step++;render()">${tr('Next','التالي')} →</button>`:''}</div></div></div>`};
P.climate=()=>{after=()=>withClim('cc',(cl,l)=>charts(cl)+`<div class="grid"><div class="card sage"><b>NASA POWER</b><div class="cap">${tr('Climate variables (temperature, precipitation, radiation) — LIVE here as monthly climatology.','متغيرات مناخية (حرارة وهطول وإشعاع) — مباشرة هنا كمناخ شهري.')}</div></div><div class="card sage"><b>NASA GPM</b><div class="cap">${tr('Rainfall observations to compare against reference periods — not connected in this prototype.','رصد الهطول للمقارنة مع فترات مرجعية — غير مربوط في هذا النموذج.')}</div></div><div class="card sage"><b>NASA SMAP</b><div class="cap">${tr('Soil-moisture estimates at coarse resolution (≈9–36 km) — not connected; not a farm-field measurement.','تقديرات رطوبة التربة بدقة واسعة (≈9–36 كم) — غير مربوط؛ وليست قياساً لحقل المزرعة.')}</div></div></div><div class="note">${tr('Climatology = multi-year monthly means, not live weather. Daily/other resolutions differ per dataset.','المناخ = متوسطات شهرية متعددة السنوات وليس طقساً حياً. الدقة الزمنية تختلف بين المجموعات.')}</div>`);return`<div class="wrap"><h2>${tr('Climate & NASA Data','المناخ وبيانات ناسا')}</h2>${locBar()}${loading('cc')}</div>`};
const pcard=p=>`<div class="card"><div class="row"><h3 style="flex:2">${tt(p.n)}</h3>${risk(p.r)}</div><p>${tt(p.d)}</p>${p.r=='na'?`<div class="note">${tr('Insufficient data to assess this risk. Add the missing farm information.','بيانات غير كافية لتقييم هذا الخطر. أضف معلومات المزرعة الناقصة.')}</div>`:`<table><tr><th>${tr('Indicators','المؤشرات')}</th><td>${p.ind.join(' · ')}</td></tr><tr><th>${tr('Data used','البيانات')}</th><td>${p.data}</td></tr><tr><th>${tr('Possible cause','السبب المحتمل')}</th><td>${tt(p.cause)}</td></tr><tr><th>${tr('Impact','الأثر')}</th><td>${tt(p.imp)}</td></tr></table><b>${tr('Suggested solutions','الحلول المقترحة')}</b><ul>${p.sol.map(s=>`<li>${tt(s)}</li>`).join('')}</ul>`}<b>${tr('Next action','الإجراء التالي')}:</b> ${tt(p.next)}</div>`;
P.problems=()=>{after=()=>withClim('pb',cl=>`<div class="grid">${problems(cl).map(pcard).join('')}</div><div class="cap">${tr('Risk rules: documented thresholds on NASA POWER climatology and user inputs; not a forecast.','قواعد الخطر: عتبات موثقة على مناخ POWER ومدخلات المستخدم؛ وليست تنبؤاً.')}</div>`);return`<div class="wrap"><h2>${tr('Agricultural Problem Analysis','تحليل المشكلات الزراعية')}</h2>${locBar()}${loading('pb')}</div>`};
P.actions=()=>{after=()=>withClim('ac',cl=>{const a=problems(cl).filter(p=>p.r=='high'||p.r=='med').sort((x,y)=>x.r=='high'?-1:1);const m=missing().join('، ');return a.length?a.map(p=>`<details class="card" open><summary><b>${tr('Alert','تنبيه')}: ${tt(p.n)}</b> ${risk(p.r)}</summary><table><tr><th>${tr('Reason','السبب')}</th><td>${tt(p.cause)}</td></tr><tr><th>${tr('Supporting data','البيانات الداعمة')}</th><td>${p.ind.join(' · ')} (${p.data})</td></tr><tr><th>${tr('Potential impact','الأثر المحتمل')}</th><td>${tt(p.imp)}</td></tr><tr><th>${tr('Suggested solution','الحل المقترح')}</th><td>${tt(p.sol[0])}</td></tr><tr><th>${tr('Steps','الخطوات')}</th><td><ol>${p.sol.slice(1).map(s=>`<li>${tt(s)}</li>`).join('')}</ol></td></tr><tr><th>${tr('Monitor next','ما يجب مراقبته')}</th><td>${tt(p.next)}</td></tr><tr><th>${tr('Confidence','الثقة')}</th><td>${['climate','drought'].includes(p.id)?tr('Low–Medium (climatology, not current observations)','منخفضة–متوسطة (مناخ وليس رصداً حالياً)'):tr('Medium (user-provided, unverified)','متوسطة (مدخلات المستخدم غير موثقة)')}</td></tr><tr><th>${tr('Missing info','معلومات ناقصة')}</th><td>${m||'—'}</td></tr></table></details>`).join(''):`<div class="note">${tr('No alert is raised: the data does not support one.','لا توجد تنبيهات: البيانات لا تدعم ذلك.')}</div>`});return`<div class="wrap"><h2>${tr('Farm Action Center','مركز إجراءات المزرعة')}</h2>${locBar()}${loading('ac')}</div>`};
P.crops=()=>{after=()=>withClim('cr',cl=>`<div class="tw"><table><tr><th>${tr('Crop','المحصول')}</th><th>${tr('Season / duration','الموسم / المدة')}</th><th>${tr('Temp. range','مدى الحرارة')}</th><th>${tr('Water','الماء')}</th><th>${tr('Soil','التربة')}</th><th>${tr('Sensitivity','الحساسية')}</th><th>${tr('Suitability here','الملاءمة هنا')}</th></tr>${CROPS.map(c=>{const[r,w,sc]=suit(c,cl);return`<tr><td><b>${tt(c.n)}</b></td><td>${c.m.length==12?tr('Year-round','طوال العام'):c.m.map(m=>MO[m]).join(' ')} · ${tt(c.dur)}</td><td>${c.T[0]}–${c.T[1]} °C</td><td>${tt(c.w)}</td><td>${c.soil.join(', ')}</td><td>${tt(c.sens)}</td><td>${sLabel(r,sc)}<div class="cap">${w}</div></td></tr>`}).join('')}</table></div><div class="note">${tr('Crop ranges are approximate general agronomic values (verify with MEWA / local extension). Suitability compares growing-season mean temperature with the range and soil type; it is not a yield guarantee. Water availability is not scored.','نطاقات المحاصيل قيم زراعية عامة تقريبية (تحقق من الوزارة/الإرشاد). الملاءمة تقارن متوسط حرارة موسم النمو بالمدى ونوع التربة وليست ضماناً للإنتاج. توفر المياه غير محتسب.')}</div>`);return`<div class="wrap"><h2>${tr('Crop Intelligence','ذكاء المحاصيل')}</h2>${locBar()}${loading('cr')}</div>`};
P.rotation=()=>`<div class="wrap"><h2>${tr('Crop Rotation Planner','مخطط تدوير المحاصيل')}</h2><div class="grid">${ROT.map((r,i)=>`<div class="card"><h3>${i+1}. ${tt(r.n)}</h3><ol>${r.seq.map(s=>`<li><b>${lang=='ar'?s[1]:s[0]}</b> <span class="cap">${lang=='ar'?s[3]:s[2]}</span></li>`).join('')}</ol><p>${tt(r.why)}</p><div class="cap">${tr('Soil management','إدارة التربة')}: ${tt(r.soilb)}</div><div class="cap">${tr('Data needed','بيانات مطلوبة')}: ${tt(r.req)}</div></div>`).join('')}</div><h3>${tr('Comparison','المقارنة')}</h3><div class="tw"><table><tr><th></th>${ROT.map(r=>`<th>${tt(r.n)}</th>`).join('')}</tr>${[['Relative water need','الاحتياج المائي النسبي','w'],['Advantages','المزايا','adv'],['Limitations','القيود','lim']].map(x=>`<tr><th>${tr(x[0],x[1])}</th>${ROT.map(r=>`<td>${tt(r[x[2]])}</td>`).join('')}</tr>`).join('')}<tr><th>${tr('Cycle','الدورة')}</th>${ROT.map(r=>`<td>${r.seq.length} ${tr('stages','مراحل')}</td>`).join('')}</tr></table></div><div class="note">${tr('Rule-based concept plans linked to crop characteristics; they do not guarantee soil improvement. Validate with local agronomists and your farm data.','خطط مفاهيمية قائمة على قواعد وخصائص المحاصيل؛ لا تضمن تحسين التربة. تحقق مع مختصين وببيانات مزرعتك.')}</div></div>`;
let aqT=null;
P.aqua=()=>{after=()=>{let i=0;clearInterval(aqT);aqT=setInterval(()=>{document.querySelectorAll('.flow div').forEach((d,j)=>d.classList.toggle('on',j==i));i=(i+1)%6},1200);aq()};const sl=(id,l,mn,mx,v,u)=>`<label>${l}: <b id="${id}v">${v}</b> ${u}<input type="range" id="${id}" min="${mn}" max="${mx}" value="${v}" oninput="aq()"></label>`;
return`<div class="wrap"><h2>${tr('Solar Aqua Simulator','محاكي سولار أكوا')}</h2><div class="flow">${[['☀️','Capture solar energy','التقاط الطاقة الشمسية'],['⚙️','Operate harvesting system','تشغيل نظام الحصاد'],['💨','Condense water vapor','تكثيف بخار الماء'],['💧','Collect water','جمع المياه'],['🛢️','Store water','تخزين المياه'],['🌱','Irrigate crops','ري المحاصيل']].map((s,i)=>`<div>${s[0]}<br>${i+1}. ${tr(s[1],s[2])}</div>`).join('')}</div><div class="card" style="margin-top:12px"><div class="grid">${sl('s1',tr('Solar radiation level','مستوى الإشعاع'),0,100,60,'%')}${sl('s2',tr('Temperature','الحرارة'),10,50,35,'°C')}${sl('s3',tr('Relative humidity','الرطوبة النسبية'),5,100,35,'%')}${sl('s4',tr('Operating duration','مدة التشغيل'),1,24,8,'h')}</div><p id="aqo"></p></div><div class="note">${tr('This is a conceptual demonstration, not a deployed device or a field-validated system. No water-yield figures are produced because no validated engineering equation is available.','هذا عرض مفاهيمي وليس جهازاً منشوراً أو نظاماً مثبتاً ميدانياً. لا تُعرض كميات مياه لعدم توفر معادلة هندسية موثقة.')}</div></div>`};
function aq(){['s1','s2','s3','s4'].forEach(i=>{if($('#'+i))$('#'+i+'v').textContent=$('#'+i).value});if(!$('#aqo'))return;const h=+$('#s3').value;$('#aqo').textContent=h>=60?tr('Qualitative note: humid air generally favors atmospheric water harvesting.','ملاحظة وصفية: الهواء الرطب يناسب عموماً حصاد المياه من الجو.'):h>=30?tr('Qualitative note: moderate humidity — conditions are limiting.','ملاحظة وصفية: رطوبة متوسطة — الظروف محدودة.'):tr('Qualitative note: very dry air is challenging for this concept.','ملاحظة وصفية: الهواء الجاف جداً يصعّب هذه الفكرة.')}
P.reports=()=>{after=()=>withClim('rp',(cl,l)=>{const ps=problems(cl),I=farm.info;return`<table><tr><th>${tr('Location','الموقع')}</th><td>${l.l} · ${l.c.map(x=>x.toFixed(4)).join(', ')}</td></tr><tr><th>${tr('Area','المساحة')}</th><td>${farmArea()?(farmArea()/1e4).toFixed(2)+' ha ('+tr('approx.','تقريبي')+')':'—'}</td></tr><tr><th>${tr('Boundary points','نقاط الحدود')}</th><td>${farm.pts.length?farm.pts.map(p=>p.map(x=>x.toFixed(5)).join(',')).join(' | '):'—'}</td></tr><tr><th>${tr('Climate (NASA POWER)','المناخ (ناسا POWER)')}</th><td>${f1(stats(cl).Ta)} °C · ${f1(stats(cl).Pa,0)} mm/yr · ${f1(stats(cl).R,2)} kWh/m²/d</td></tr><tr><th>${tr('User-provided','مدخلات المستخدم')}</th><td>${Object.entries(I).map(e=>e.join(': ')).join(' · ')||'—'}</td></tr><tr><th>${tr('Challenges & risks','التحديات والمخاطر')}</th><td>${ps.map(p=>tt(p.n)+': '+risk(p.r)+' — '+tt(p.sol[0])).join('<br>')}</td></tr><tr><th>${tr('Crop suitability','ملاءمة المحاصيل')}</th><td>${CROPS.map(c=>{const[r,w,sc]=suit(c,cl);return tt(c.n)+': '+(r=='na'?'—':[tr('Low','منخفضة'),tr('Medium','متوسطة'),tr('High','عالية')][sc])}).join(' · ')}</td></tr><tr><th>${tr('Rotation strategies','استراتيجيات التدوير')}</th><td>${ROT.map(r=>tt(r.n)+' ('+r.seq.map(s=>lang=='ar'?s[1]:s[0]).join(' → ')+')').join('<br>')}</td></tr><tr><th>${tr('Data provenance','مصدر البيانات')}</th><td>${tr('Satellite/model-derived: NASA POWER · User-provided: farm form · System-calculated: risks, suitability, area · Not connected: GPM, SMAP, Saudi datasets','مشتق من الأقمار/النماذج: NASA POWER · مدخلات المستخدم: النموذج · محسوب بالنظام: المخاطر والملاءمة والمساحة · غير مربوط: GPM وSMAP والبيانات السعودية')}</td></tr><tr><th>${tr('Limitations','القيود')}</th><td>${tr('Climatology ≠ current conditions; ~0.5° grid is not a farm measurement; no yield prediction; no salinity/nutrient data.','المناخ ≠ الظروف الحالية؛ شبكة 0.5° ليست قياساً للمزرعة؛ لا تنبؤ بالإنتاج؛ لا بيانات ملوحة/عناصر.')}</td></tr></table><p class="cap">${tr('Generated','أُنشئ في')}: ${new Date().toLocaleString()}</p>`});return`<div class="wrap"><h2>${tr('Reports & Outputs','التقارير والمخرجات')}</h2>${locBar()}<button class="btn lf noprint" onclick="window.print()">⬇️ ${tr('Download PDF Report','تحميل تقرير PDF')}</button><div class="cap noprint">${tr('In the print dialog choose “Save as PDF”.','في نافذة الطباعة اختر «حفظ بصيغة PDF».')}</div><div class="card">${loading('rp')}</div></div>`};
P.sources=()=>`<div class="wrap"><h2>${tr('Data Sources & Methodology','مصادر البيانات والمنهجية')}</h2>${[[tr('NASA data','بيانات ناسا'),SRC.filter(s=>s.nasa)],[tr('Official Saudi government data','بيانات حكومية سعودية رسمية'),SRC.filter(s=>!s.nasa)]].map(g=>`<h3>${g[0]}</h3><div class="tw"><table><tr><th>${tr('Organization / dataset','الجهة / المجموعة')}</th><th>${tr('Type','النوع')}</th><th>${tr('Coverage / resolution','التغطية / الدقة')}</th><th>${tr('Period','الفترة')}</th><th>${tr('Use','الاستخدام')}</th><th>${tr('Limitations','القيود')}</th></tr>${g[1].map(s=>`<tr><td><a href="${s.u}" target="_blank" rel="noopener">${tt(s.o)}</a></td><td>${tt(s.t)}</td><td>${tt(s.cov)}</td><td>${tt(s.per)}</td><td>${tt(s.use)}</td><td>${tt(s.lim)}</td></tr>`).join('')}</table></div>`).join('')}<h3>${tr('Other categories','فئات أخرى')}</h3><ul><li>${tr('User-provided: farm setup form (unverified).','مدخلات المستخدم: نموذج إعداد المزرعة (غير موثقة).')}</li><li>${tr('Satellite imagery / maps: Esri World Imagery, OpenStreetMap — mapping only, NOT NASA data.','صور الأقمار/الخرائط: Esri وOpenStreetMap — للخرائط فقط وليست بيانات ناسا.')}</li><li>${tr('System-calculated: risk levels, crop suitability, area (documented rules).','محسوبة بالنظام: مستويات الخطر وملاءمة المحاصيل والمساحة (قواعد موثقة).')}</li><li>${tr('Illustrative sample data: none is used; unavailable data is shown as unavailable.','بيانات توضيحية: لا تُستخدم؛ البيانات غير المتاحة تُعرض كغير متاحة.')}</li></ul></div>`;

/* ---------- router ---------- */
function render(){maps.forEach(m=>{try{m.remove()}catch(e){}});maps=[];S=null;clearInterval(aqT);after=null;curLoc();
const [p,a]=(location.hash.slice(2)||'home').split('/');page=P[p]?p:'home';arg=a;if(p=='mode')page='tools';
$('#app').innerHTML=P[page]();$('#nav').innerHTML=NAV.map(n=>`<a class="${n[0]==page||(page=='region'&&n[0]=='regions')||(page=='map'&&n[0]=='setup')||(page=='tools'&&n[0]=='home'&&0)?'on':''}" onclick="go('${n[0]}');$('#nav').classList.remove('open')">${tr(n[1],n[2])}</a>`).join('');$('#lg').textContent=lang=='ar'?'EN':'AR';
document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';window.scrollTo(0,0);if(after)after()}
function setLang(){lang=lang=='ar'?'en':'ar';render()}
window.addEventListener('hashchange',render);render();
</script></body></html>
